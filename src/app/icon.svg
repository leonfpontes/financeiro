<svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="2" y1="2" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="48%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="shine" x1="20" y1="0" x2="20" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="40" height="40" rx="11"/>
    </clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="40" height="40" rx="11" fill="url(#bg)"/>

  <!-- Glass shine -->
  <g clip-path="url(#clip)">
    <rect width="40" height="22" fill="url(#shine)"/>
  </g>

  <!-- F — vertical stem -->
  <rect x="9.5" y="9" width="5" height="22" rx="2.5" fill="white"/>
  <!-- F — top bar -->
  <rect x="9.5" y="9" width="20.5" height="5" rx="2.5" fill="white"/>
  <!-- F — middle bar -->
  <rect x="9.5" y="17.5" width="14.5" height="5" rx="2.5" fill="white"/>

  <!-- Trend line accent -->
  <path d="M 19.5 30.5 C 22.5 26 26 21.5 31 15" stroke="rgba(255,255,255,0.32)" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Trend dot -->
  <circle cx="31" cy="15" r="2.5" fill="rgba(255,255,255,0.55)" filter="url(#glow)"/>
</svg>
